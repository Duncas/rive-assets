<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <script/unpkg.com/@rive-app/canvasscript>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>

<body>

<canvas id="riveCanvas"></canvas>

<script>
new rive.Rive({
  src: "optout.riv",
  canvas: document.getElementById("riveCanvas"),
  autoplay: true
});
</script>

</body>
</html>
